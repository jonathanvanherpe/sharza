#
# Drop-in that places a worker inside the VPN namespace prepared by
# sharzad-vpn-netns.service. Apply only to worker roles (bt, ed2k, g2)
# that should egress via the VPN; leave the supervisor in the root
# namespace so the web UI and RPC stay reachable when the tunnel drops.
#
# Install:
#   mkdir -p /etc/systemd/system/sharzad@.service.d
#   cp vpn.conf /etc/systemd/system/sharzad@.service.d/vpn.conf
#   systemctl daemon-reload

[Service]
# Requires sharzad-vpn-netns.service to have created the namespace first.
NetworkNamespacePath=/run/netns/sharza-vpn