<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later
       Sharza logo: amber S inside a ruby tesseract, tesseract rotated 45deg.
       The S is the Kaushan Script capital letterform (Pablo Impallari,
       SIL OFL 1.1, https://openfontlicense.org), slant cancelled, upright,
       clipped to the front diamond. -->
  <defs>
    <linearGradient id="gem" x1="8" y1="120" x2="232" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a6e"/>
      <stop offset="1" stop-color="#a31327"/>
    </linearGradient>
    <linearGradient id="gemFront" x1="8" y1="120" x2="232" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d94c5d"/>
      <stop offset="1" stop-color="#8a1021"/>
    </linearGradient>
    <radialGradient id="facet" cx="0.5" cy="0.42" r="0.75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff5a6e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a31327" stop-opacity="0.15"/>
    </radialGradient>
    <clipPath id="box"><polygon points="120.0,22.2 217.8,120.0 120.0,217.8 22.2,120.0"/></clipPath>
  </defs>

  <!-- FAR layer: behind the S (more opaque) -->
  <g fill="none" stroke="url(#gem)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="10" opacity="0.55"><line x1="114.0" y1="2.0" x2="114.0" y2="61.1"/><line x1="211.8" y1="99.7" x2="150.7" y2="97.7"/><line x1="16.2" y1="99.7" x2="77.3" y2="97.7"/><line x1="114.0" y1="197.5" x2="114.0" y2="134.4"/></g>
    <g stroke-width="12" opacity="0.65"><line x1="114.0" y1="2.0" x2="120.0" y2="22.2"/><line x1="211.8" y1="99.7" x2="217.8" y2="120.0"/><line x1="16.2" y1="99.7" x2="22.2" y2="120.0"/><line x1="114.0" y1="197.5" x2="120.0" y2="217.8"/>
      <polygon points="114.0,2.0 211.8,99.7 114.0,197.5 16.2,99.7"/></g>
    <g stroke-width="11" opacity="0.55"><line x1="114.0" y1="61.1" x2="120.0" y2="83.3"/><line x1="150.7" y1="97.7" x2="156.7" y2="120.0"/><line x1="77.3" y1="97.7" x2="83.3" y2="120.0"/><line x1="114.0" y1="134.4" x2="120.0" y2="156.7"/>
      <polygon points="114.0,61.1 150.7,97.7 114.0,134.4 77.3,97.7"/></g>
  </g>

