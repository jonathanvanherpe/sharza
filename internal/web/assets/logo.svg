  <g fill="none" stroke="url(#gemFront)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="12" opacity="0.80"><line x1="120.0" y1="22.2" x2="120.0" y2="83.3"/><line x1="217.8" y1="120.0" x2="156.7" y2="120.0"/><line x1="22.2" y1="120.0" x2="83.3" y2="120.0"/><line x1="120.0" y1="217.8" x2="120.0" y2="156.7"/></g>
    <g stroke-width="16" opacity="0.90"><polygon points="120.0,22.2 217.8,120.0 120.0,217.8 22.2,120.0"/></g>
    <g stroke-width="14" opacity="1.00"><polygon points="120.0,83.3 156.7,120.0 120.0,156.7 83.3,120.0"/></g>
  </g>

